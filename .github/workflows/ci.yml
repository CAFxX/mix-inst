name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # weekly: catch drift from toolchain changes even without pushes
    - cron: "0 6 * * 1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy

      - name: make all (regenerate + tests + drift check)
        run: make all
