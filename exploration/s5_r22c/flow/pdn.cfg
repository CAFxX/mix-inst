# PDN config for sky130_fd_sc_hd (OpenROAD 2.0 pdngen syntax).
# Core domain on VPWR/VGND; met1 standard-cell rails + met4/met5 core straps.
set_voltage_domain -name CORE -power VPWR -ground VGND

define_pdn_grid -name stdcell_grid -starts_with POWER -voltage_domains CORE
add_pdn_stripe -grid stdcell_grid -layer met1 -width 0.48 -pitch 3.33 \
    -offset 0 -starts_with POWER -extend_to_core_ring

define_pdn_grid -name core_grid -starts_with POWER -voltage_domains CORE \
    -pins "met4 met5"
add_pdn_stripe -grid core_grid -layer met4 -width 1.6 -pitch 20 \
    -offset 2 -starts_with POWER -extend_to_core_ring
add_pdn_stripe -grid core_grid -layer met5 -width 1.6 -pitch 20 \
    -offset 2 -starts_with POWER -extend_to_core_ring
add_pdn_connect -grid core_grid -layers "met1 met4"
add_pdn_connect -grid core_grid -layers "met4 met5"
